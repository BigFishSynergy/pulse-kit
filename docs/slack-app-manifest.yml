# Slack app manifest for the company's Pulse app (api.slack.com/apps, Create New App, From a manifest).
# Change the name. The app only posts: chat:write for channels it is added to, im:write to DM the admin,
# files:write for graphics. It reads nothing from Slack.
display_information:
  name: Company Pulse
  description: Daily numbers and notices from the company's Pulse.
features:
  bot_user:
    display_name: Pulse
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - files:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
